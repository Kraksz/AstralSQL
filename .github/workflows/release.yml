name: Build Windows beta artifacts
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: npm ci
      - run: npm test
      - run: npm run release:check
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --no-default-features --locked
      - run: npm run desktop:build -- --bundles nsis
      - name: Generate checksums
        shell: pwsh
        run: |
          Get-ChildItem target/release/bundle/nsis/*-setup.exe | ForEach-Object {
            "$((Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          } | Set-Content -Encoding ascii target/release/bundle/nsis/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: astral-sql-windows-x64-beta
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
